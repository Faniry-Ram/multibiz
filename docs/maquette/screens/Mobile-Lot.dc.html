<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MultiBiz mobile — Bande 4</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
.mb{--bg:#F8FAFC;--surface:#FFFFFF;--surface2:#F1F5F9;--border:#E2E8F0;--text:#0F172A;--text2:#334155;--muted:#64748B;--primary:#2563EB;--primary-soft:#EFF6FF;--primary-text:#1D4ED8;--pos:#047857;--pos-soft:#ECFDF5;--neg:#C2410C;--neg-soft:#FFF7ED;--warn:#A16207;--warn-soft:#FEF9C3;--slate-soft:#F1F5F9;--slate-text:#334155;--shadow:0 1px 2px rgba(15,23,42,0.04),0 6px 20px rgba(15,23,42,0.05);--b1:#D97706;--b2:#DB2777;--b3:#0891B2}
.mb.dark{--bg:#020617;--surface:#0F172A;--surface2:#1E293B;--border:#1E293B;--text:#F1F5F9;--text2:#CBD5E1;--muted:#94A3B8;--primary-soft:rgba(59,130,246,0.16);--primary-text:#93C5FD;--pos:#34D399;--pos-soft:rgba(52,211,153,0.13);--neg:#FB923C;--neg-soft:rgba(251,146,60,0.13);--warn:#FACC15;--warn-soft:rgba(250,204,21,0.12);--slate-soft:rgba(148,163,184,0.14);--slate-text:#CBD5E1;--shadow:0 1px 2px rgba(0,0,0,0.35);--b2:#E0569A;--b3:#0EA5C6}
a{color:var(--primary-text)}a:hover{color:var(--primary)}
</style>
</helmet>
<div class="mb {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Geist', system-ui, sans-serif; padding: 16px 20px 16px; display: flex; flex-direction: column; gap: 12px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="Mobile-Accueil.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; box-sizing: border-box; color: var(--text)">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em">Bande 4</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted)"><span style="width: 7px; height: 7px; border-radius: 2px; background: var(--b1)"></span>Poulets de chair · J21 / 45</span>
    </div>
    <button type="button" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}" style="all: unset; cursor: pointer; box-sizing: border-box; margin-left: auto; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; color: var(--text2)">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"></path></svg></sc-if>
    </button>
  </header>

  <section aria-label="Effectif et coûts" style="padding: 16px; border-radius: 18px; background: #2563EB; color: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #EFF6FF">// effectif</span>
        <span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Geist Mono', monospace; font-size: 42px; font-weight: 500; letter-spacing: -0.04em; line-height: 1">{{eff}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 14px; color: #EFF6FF">/ 80 · pertes {{lossPct}}</span></span>
      </div>
    </div>
    <div style="height: 7px; border-radius: 999px; background: rgba(255,255,255,0.22)"><div style="width: 47%; height: 100%; border-radius: 999px; background: #FFFFFF"></div></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 8px; border-radius: 9px; background: rgba(255,255,255,0.12)"><span style="font-size: 11px; color: #EFF6FF">Coût à ce jour</span><span style="font-family: 'Geist Mono', monospace; font-size: 13px">{{cost}}</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 8px; border-radius: 9px; background: rgba(255,255,255,0.12)"><span style="font-size: 11px; color: #EFF6FF">Par poulet</span><span style="font-family: 'Geist Mono', monospace; font-size: 13px">{{perBird}}</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 8px; border-radius: 9px; background: rgba(255,255,255,0.12)"><span style="font-size: 11px; color: #EFF6FF">Marge visée</span><span style="font-family: 'Geist Mono', monospace; font-size: 13px">{{margin}}</span></div>
    </div>
  </section>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px">
    <button type="button" onClick="{{addLoss}}" style="all: unset; cursor: pointer; box-sizing: border-box; height: 54px; border-radius: 12px; background: var(--neg-soft); color: var(--neg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600"><span style="font-family: 'Geist Mono', monospace; font-size: 16px">−1</span>Perte</button>
    <button type="button" style="all: unset; cursor: pointer; box-sizing: border-box; height: 54px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 13l3-3M12 3v2"></path></svg>Pesée</button>
    <button type="button" style="all: unset; cursor: pointer; box-sizing: border-box; height: 54px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--warn)"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg>Note</button>
    <button type="button" style="all: unset; cursor: pointer; box-sizing: border-box; height: 54px; border-radius: 12px; background: #2563EB; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Vendre</button>
  </div>

  <section aria-labelledby="m-res" style="background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px 4px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 4px">
      <h2 id="m-res" style="margin: 0; font-family: 'Geist Mono', monospace; font-size: 11.5px; font-weight: 500; color: var(--muted)">// ressources du lot</h2>
      <span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; color: var(--muted)">stock du projet</span>
    </div>
    <sc-for list="{{res}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border)">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 600">{{r.name}}</span>
          <span style="{{r.metaStyle}}">{{r.meta}}</span>
        </span>
        <button type="button" onClick="{{r.act}}" disabled="{{r.disabled}}" style="{{r.btnStyle}}">{{r.btn}}</button>
      </div>
    </sc-for>
  </section>

  <section aria-labelledby="m-log" style="display: flex; flex-direction: column; gap: 2px">
    <h2 id="m-log" style="margin: 0 0 4px; font-family: 'Geist Mono', monospace; font-size: 11.5px; font-weight: 500; color: var(--muted)">// journal du lot</h2>
    <sc-for list="{{log}}" as="l" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border)">
        <span style="flex: none; width: 66px; font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--muted)">{{l.time}}</span>
        <span style="flex: 1; font-size: 13px">{{l.text}}</span>
        <span style="{{l.style}}">{{l.val}}</span>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      eff: 77, extra: 0,
      res: [
        { id: "gum", name: "Vaccin Gumboro", unit: "flacon", left: 1, price: 6000, meta: "à faire aujourd'hui" },
        { id: "cro", name: "Provende croissance", unit: "sac", left: 1, price: 32000, meta: "≈ 5 jours" },
        { id: "vit", name: "Vitamines", unit: "sachet", left: 1, price: 2000, meta: "≈ 3 jours" },
        { id: "fin", name: "Provende finition", unit: "sac", left: 0, price: 33000, meta: "3 sacs à acheter avant le 24 oct." }
      ],
      log: [
        { time: "07:00", text: "Utilisé : 1 sac de provende croissance", val: "32 000", tone: "use" },
        { time: "09:40", text: "Perte : 1 poulet", val: "−1", tone: "neg" },
        { time: "hier", text: "Achat : 2 sacs de provende croissance", val: "− 64 000", tone: "neg" }
      ]
    };
  }
  renderVals() {
    const s = this.state;
    const dark = s.dark ?? ((this.props.theme ?? "dark") === "dark");
    const fmt = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    const losses = 80 - s.eff;
    const cost = 370000 + s.extra;
    const margin = s.eff * 14000 - 500000;
    const push = (entry, st) => [entry, ...st.log].slice(0, 3);
    return {
      themeClass: dark ? "dark" : "light",
      isDark: dark, isLight: !dark,
      themeLabel: dark ? "Passer en mode clair" : "Passer en mode sombre",
      toggleTheme: () => this.setState({ dark: !dark }),
      eff: String(s.eff),
      lossPct: Math.round(losses / 80 * 100) + " %",
      cost: fmt(cost),
      perBird: fmt(cost / s.eff),
      margin: "≈ " + fmt(margin),
      addLoss: () => this.setState((st) => st.eff <= 0 ? null : ({ eff: st.eff - 1, log: push({ time: "à l'instant", text: "Perte : 1 poulet", val: "−1", tone: "neg" }, st) })),
      res: s.res.map((r) => {
        const empty = r.left <= 0;
        const low = !empty && r.meta.indexOf("jours") >= 0 && parseInt(r.meta.replace(/\D/g, ""), 10) < 4;
        return {
          name: r.name,
          meta: empty ? r.meta : "reste " + r.left + " " + r.unit + (r.left > 1 ? "s" : "") + " · " + r.meta,
          metaStyle: "font-size: 12px; color: " + (empty ? "var(--primary-text)" : low ? "var(--warn)" : "var(--muted)"),
          btn: empty ? "Acheter" : "Utiliser",
          disabled: false,
          btnStyle: "all: unset; cursor: pointer; flex: none; padding: 8px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 600; " + (empty ? "border: 1px solid var(--border); color: var(--text);" : "background: var(--primary-soft); color: var(--primary-text);"),
          act: () => this.setState((st) => {
            if (empty) return null;
            return {
              res: st.res.map((x) => x.id === r.id ? { ...x, left: x.left - 1, meta: x.left - 1 <= 0 ? "épuisé · à racheter" : x.meta } : x),
              extra: st.extra + r.price,
              log: push({ time: "à l'instant", text: "Utilisé : 1 " + r.unit + " de " + r.name.charAt(0).toLowerCase() + r.name.slice(1), val: fmt(r.price), tone: "use" }, st)
            };
          })
        };
      }),
      log: s.log.map((l) => ({ ...l, style: "flex: none; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 500; color: " + (l.tone === "neg" ? "var(--neg)" : l.tone === "use" ? "var(--primary-text)" : "var(--pos)") }))
    };
  }
}
</script>
</body>
</html>
